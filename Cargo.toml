[package]
name = "rs-http-apilab"
version = "1.0.0"
edition = "2021"
description = "Deterministic synthetic HTTP API lab server (Rust port of the v-http-apilab concept)"
license = "MIT"
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
form_urlencoded = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tower = "0.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
